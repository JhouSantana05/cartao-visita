<!DOCTYPE html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Burguer & Cia | Cardápio Digital & Delivery</title>
  <meta name="description" content="Cardápio digital moderno com pedidos diretos pelo WhatsApp. Hambúrgueres artesanais, porções e bebidas.">
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            amber: {
              400: '#fbbf24',
              500: '#f59e0b',
              600: '#d97706',
            }
          }
        }
      }
    }
  </script>
  <style>
    .glass {
      background: rgba(24, 24, 27, 0.75);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }
    .glass-card {
      background: rgba(18, 18, 20, 0.8);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      border: 1px solid rgba(255, 255, 255, 0.06);
    }
    /* Hide scrollbar for category tabs */
    .no-scrollbar::-webkit-scrollbar {
      display: none;
    }
    .no-scrollbar {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="bg-zinc-950 text-zinc-100 min-h-screen pb-28 selection:bg-amber-500 selection:text-black">

  <!-- Toast Notification Container -->
  <div id="toast-container" class="fixed top-5 z-50 flex flex-col gap-2 pointer-events-none transition-all duration-300 w-full max-w-xs px-4 left-1/2 -translate-x-1/2" role="status" aria-live="polite"></div>

  <!-- Header -->
  <header class="sticky top-0 z-30 glass border-b border-zinc-800">
    <div class="max-w-xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <a href="/" class="p-2 rounded-lg bg-zinc-800/80 hover:bg-zinc-700 text-zinc-300 transition" title="Voltar ao Portfólio de JS Web & Negócios">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/></svg>
        </a>
        <div>
          <h1 class="text-base font-bold text-white flex items-center gap-1.5">
            🍔 Burguer & Cia
            <span class="inline-block w-2 h-2 rounded-full bg-emerald-500"></span>
          </h1>
          <p class="text-xs text-zinc-400">Entrega rápida em 35-50 min • São Miguel</p>
        </div>
      </div>

      <!-- Quick Cart Button in Header -->
      <button onclick="toggleCartModal(true)" class="relative p-2.5 rounded-xl bg-amber-500/10 text-amber-400 border border-amber-500/20 active:scale-95 transition">
        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z"/></svg>
        <span id="cart-badge-header" class="hidden absolute -top-1 -right-1 bg-amber-500 text-black text-[10px] font-bold w-5 h-5 rounded-full items-center justify-center">0</span>
      </button>
    </div>

    <!-- Category Filter Bar -->
    <div class="max-w-xl mx-auto px-4 pb-3 flex gap-2 overflow-x-auto no-scrollbar" id="category-tabs">
      <button onclick="filterCategory('todos')" class="category-btn active px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-amber-500 text-black" data-cat="todos">Todos</button>
      <button onclick="filterCategory('burgers')" class="category-btn px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-zinc-800 text-zinc-300 hover:bg-zinc-700" data-cat="burgers">Hambúrgueres</button>
      <button onclick="filterCategory('porcoes')" class="category-btn px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-zinc-800 text-zinc-300 hover:bg-zinc-700" data-cat="porcoes">Porções</button>
      <button onclick="filterCategory('bebidas')" class="category-btn px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-zinc-800 text-zinc-300 hover:bg-zinc-700" data-cat="bebidas">Bebidas</button>
      <button onclick="filterCategory('sobremesas')" class="category-btn px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-zinc-800 text-zinc-300 hover:bg-zinc-700" data-cat="sobremesas">Sobremesas</button>
    </div>
  </header>

  <!-- Banner Informativo -->
  <div class="max-w-xl mx-auto px-4 mt-4">
    <div class="p-3.5 rounded-2xl bg-gradient-to-r from-amber-500/15 via-zinc-900 to-zinc-900 border border-amber-500/20 flex items-center justify-between gap-3">
      <div class="flex items-center gap-3">
        <span class="text-2xl">🛵</span>
        <div>
          <p class="text-xs font-bold text-amber-400">Taxa grátis acima de R$ 60,00!</p>
          <p class="text-[11px] text-zinc-400">Faça seu pedido e envie direto para o WhatsApp do restaurante.</p>
        </div>
      </div>
    </div>
  </div>

  <!-- Product List Grid -->
  <main class="max-w-xl mx-auto px-4 mt-5 space-y-3" id="product-container">
    <!-- Rendered Dynamically by JavaScript -->
  </main>

  <!-- Floating Sticky Bottom Bar for Cart Checkout -->
  <div id="sticky-cart-bar" class="hidden fixed bottom-4 inset-x-4 max-w-xl mx-auto z-40">
    <button onclick="toggleCartModal(true)" class="w-full flex items-center justify-between p-4 rounded-2xl bg-gradient-to-r from-amber-500 to-amber-600 text-black font-bold shadow-2xl shadow-amber-900/50 active:scale-[0.99] transition">
      <div class="flex items-center gap-2.5">
        <span class="w-7 h-7 rounded-full bg-black/20 flex items-center justify-center text-xs" id="sticky-cart-count">0</span>
        <span class="text-sm tracking-wide">Ver Pedido</span>
      </div>
      <span class="text-base font-black" id="sticky-cart-total">R$ 0,00</span>
    </button>
  </div>

  <!-- Cart Drawer Modal -->
  <div id="cart-modal" class="hidden fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-end justify-center p-0 sm:p-4">
    <div class="bg-zinc-900 border border-zinc-800 rounded-t-3xl sm:rounded-3xl w-full max-w-lg max-h-[90vh] flex flex-col shadow-2xl overflow-hidden">
      
      <!-- Modal Header -->
      <div class="p-4 border-b border-zinc-800 flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-xl">🛍️</span>
          <h2 class="text-base font-bold text-white">Seu Pedido</h2>
        </div>
        <button onclick="toggleCartModal(false)" class="p-2 text-zinc-400 hover:text-white rounded-lg bg-zinc-800/60">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
      </div>

      <!-- Modal Body (Cart Items + Customer Data) -->
      <div class="p-4 overflow-y-auto space-y-4 flex-1">
        
        <!-- Cart Items List -->
        <div id="cart-items-list" class="space-y-2.5">
          <!-- Rendered by JS -->
        </div>

        <!-- Divider -->
        <div class="border-t border-zinc-800 pt-3 space-y-3">
          <h3 class="text-xs font-bold uppercase tracking-wider text-zinc-400">Dados para Entrega</h3>
          
          <div>
            <label class="block text-xs text-zinc-400 mb-1">Seu Nome *</label>
            <input type="text" id="order-name" placeholder="Ex: Carlos Silva" class="w-full bg-zinc-800/80 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
          </div>

          <div>
            <label class="block text-xs text-zinc-400 mb-1">Endereço de Entrega (ou Retirada) *</label>
            <input type="text" id="order-address" placeholder="Rua, Número, Bairro, Compl." class="w-full bg-zinc-800/80 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
          </div>

          <div>
            <label class="block text-xs text-zinc-400 mb-1">Forma de Pagamento</label>
            <select id="order-payment" class="w-full bg-zinc-800/80 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
              <option value="Pix">Pix (Chave informada no zap)</option>
              <option value="Cartão de Débito/Crédito (Máquina)">Cartão na Entrega (Máquina)</option>
              <option value="Dinheiro">Dinheiro (Precisa de troco?)</option>
            </select>
          </div>

          <div>
            <label class="block text-xs text-zinc-400 mb-1">Observações do Pedido (opcional)</label>
            <input type="text" id="order-notes" placeholder="Ex: Sem cebola, maionese à parte..." class="w-full bg-zinc-800/80 border border-zinc-700 rounded-xl px-3.5 py-2.5 text-sm text-white focus:outline-none focus:border-amber-500">
          </div>
        </div>

      </div>

      <!-- Modal Footer -->
      <div class="p-4 border-t border-zinc-800 bg-zinc-950/80 space-y-3">
        <div class="flex justify-between items-center text-sm">
          <span class="text-zinc-400">Total do Pedido:</span>
          <span class="text-xl font-black text-amber-400" id="cart-modal-total">R$ 0,00</span>
        </div>

        <button 
          onclick="checkoutWhatsApp()" 
          class="w-full py-3.5 px-4 rounded-xl font-bold text-white bg-emerald-600 hover:bg-emerald-500 active:scale-[0.98] transition flex items-center justify-center gap-2 shadow-lg shadow-emerald-950"
        >
          <svg class="w-5 h-5 fill-current" viewBox="0 0 24 24"><path d="M.057 24l1.687-6.163c-1.041-1.804-1.588-3.849-1.587-5.946.003-6.556 5.338-11.891 11.893-11.891 3.181.001 6.167 1.24 8.413 3.488 2.245 2.248 3.481 5.236 3.48 8.414-.003 6.557-5.338 11.892-11.893 11.892-1.99-.001-3.951-.5-5.688-1.448l-6.305 1.654zm6.597-3.807c1.676.995 3.276 1.591 5.392 1.592 5.448 0 9.886-4.434 9.889-9.885.002-5.462-4.415-9.89-9.881-9.892-5.452 0-9.887 4.434-9.889 9.884-.001 2.225.651 3.891 1.746 5.634l-.999 3.648 3.742-.981zm11.387-5.464c-.074-.124-.272-.198-.57-.347-.297-.149-1.758-.868-2.031-.967-.272-.099-.47-.149-.669.149-.198.297-.768.967-.941 1.165-.173.198-.347.223-.644.074-.297-.149-1.255-.462-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.297-.347.446-.521.151-.172.2-.296.3-.495.099-.198.05-.372-.025-.521-.075-.148-.669-1.611-.916-2.206-.242-.579-.487-.501-.669-.51l-.57-.01c-.198 0-.52.074-.792.372s-1.04 1.016-1.04 2.479 1.065 2.876 1.213 3.074c.149.198 2.095 3.2 5.076 4.487.709.306 1.263.489 1.694.626.712.226 1.36.194 1.872.118.571-.085 1.758-.719 2.006-1.413.248-.695.248-1.29.173-1.414z"/></svg>
          Enviar Pedido no WhatsApp
        </button>
      </div>

    </div>
  </div>

  <script>
    // Dados do Cardápio
    const products = [
      {
        id: 1,
        category: 'burgers',
        name: 'Smash Bacon Supreme',
        description: 'Dois burgers artesanais 90g, queijo cheddar derretido, fatias crocantes de bacon e maionese defumada no pão brioche.',
        price: 32.00,
        emoji: '🍔'
      },
      {
        id: 2,
        category: 'burgers',
        name: 'Classic Salad Cheddar',
        description: 'Hambúrguer 160g bovino, queijo prato, alface americana fresca, tomate maduro e molho especial da casa.',
        price: 28.00,
        emoji: '🥩'
      },
      {
        id: 3,
        category: 'burgers',
        name: 'Double Costela Burger',
        description: 'Hambúrguer suculento de costela 180g, cebola caramelizada, queijo provolone e molho barbecue rústico.',
        price: 36.50,
        emoji: '🔥'
      },
      {
        id: 4,
        category: 'porcoes',
        name: 'Batata Rústica c/ Alecrim',
        description: 'Batatas rústicas com casca, fritas na hora com ramos de alecrim fresco e alho confit. Acompanha maionese verde.',
        price: 22.00,
        emoji: '🍟'
      },
      {
        id: 5,
        category: 'porcoes',
        name: 'Coxinha Artesanal sem Massa (6 un)',
        description: 'Frango desfiado suculento com requeijão cremoso, empanado em farinha panko super crocante.',
        price: 24.00,
        emoji: '🍗'
      },
      {
        id: 6,
        category: 'bebidas',
        name: 'Coca-Cola Original 350ml',
        description: 'Lata gelada para acompanhar seu lanche.',
        price: 6.50,
        emoji: '🥤'
      },
      {
        id: 7,
        category: 'bebidas',
        name: 'Suco Natural de Laranja 500ml',
        description: 'Extraído na hora, 100% fruta sem adição de açúcar.',
        price: 9.00,
        emoji: '🍊'
      },
      {
        id: 8,
        category: 'sobremesas',
        name: 'Brownie de Chocolate c/ Nutella',
        description: 'Pedaço generoso de brownie artesanal com nozes e cobertura de creme de avelã.',
        price: 15.00,
        emoji: '🍫'
      }
    ];

    let cart = {};

    // Sistema de Toasts Animados
    function showToast(message, type = 'info') {
      const container = document.getElementById('toast-container');
      const toast = document.createElement('div');
      
      const icon = type === 'success' ? '✅' : 'ℹ️';
      const bgColor = type === 'success' ? 'bg-zinc-900 border-emerald-500/50 text-emerald-300' : 'bg-zinc-900 border-amber-500/50 text-amber-300';
      
      toast.className = `flex items-center gap-2.5 px-4 py-3 rounded-xl border backdrop-blur-md shadow-2xl shadow-black/80 text-sm font-medium transform transition-all duration-300 opacity-0 -translate-y-2 pointer-events-auto ${bgColor}`;
      toast.innerHTML = `<span>${icon}</span><span class="flex-1">${message}</span>`;
      
      container.appendChild(toast);
      
      requestAnimationFrame(() => {
        toast.classList.remove('opacity-0', '-translate-y-2');
      });
      
      setTimeout(() => {
        toast.classList.add('opacity-0', '-translate-y-2');
        setTimeout(() => toast.remove(), 300);
      }, 2500);
    }

    // Renderização dos Produtos
    function renderProducts(filter = 'todos') {
      const container = document.getElementById('product-container');
      container.innerHTML = '';

      const filtered = filter === 'todos' 
        ? products 
        : products.filter(p => p.category === filter);

      filtered.forEach(product => {
        const card = document.createElement('div');
        card.className = 'glass-card rounded-2xl p-4 flex gap-3.5 items-center justify-between hover:border-zinc-700 transition';
        
        card.innerHTML = `
          <div class="flex-1">
            <div class="flex items-center gap-1.5">
              <span class="text-xl">${product.emoji}</span>
              <h3 class="text-sm sm:text-base font-bold text-white">${product.name}</h3>
            </div>
            <p class="text-xs text-zinc-400 mt-1 line-clamp-2 leading-relaxed">${product.description}</p>
            <p class="text-sm font-black text-amber-400 mt-2">R$ ${product.price.toFixed(2).replace('.', ',')}</p>
          </div>
          <button 
            onclick="addToCart(${product.id})" 
            class="shrink-0 px-3.5 py-2 rounded-xl bg-zinc-800 hover:bg-amber-500 hover:text-black font-semibold text-xs text-amber-400 border border-zinc-700/80 active:scale-95 transition"
          >
            + Adicionar
          </button>
        `;
        container.appendChild(card);
      });
    }

    // Filtrar categorias
    function filterCategory(cat) {
      document.querySelectorAll('.category-btn').forEach(btn => {
        if (btn.dataset.cat === cat) {
          btn.className = 'category-btn active px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-amber-500 text-black';
        } else {
          btn.className = 'category-btn px-3.5 py-1.5 rounded-full text-xs font-semibold whitespace-nowrap transition bg-zinc-800 text-zinc-300 hover:bg-zinc-700';
        }
      });
      renderProducts(cat);
    }

    // Gerenciamento do Carrinho
    function addToCart(productId) {
      const product = products.find(p => p.id === productId);
      if (!product) return;

      if (!cart[productId]) {
        cart[productId] = { ...product, quantity: 1 };
      } else {
        cart[productId].quantity += 1;
      }

      showToast(`+1 ${product.name} adicionado!`, 'success');
      updateCartUI();
    }

    function updateCartQuantity(productId, delta) {
      if (!cart[productId]) return;

      cart[productId].quantity += delta;
      if (cart[productId].quantity <= 0) {
        delete cart[productId];
      }
      updateCartUI();
    }

    function updateCartUI() {
      const items = Object.values(cart);
      const totalCount = items.reduce((acc, item) => acc + item.quantity, 0);
      const totalPrice = items.reduce((acc, item) => acc + (item.price * item.quantity), 0);
      const formattedTotal = `R$ ${totalPrice.toFixed(2).replace('.', ',')}`;

      // Badge Top Header
      const headerBadge = document.getElementById('cart-badge-header');
      if (totalCount > 0) {
        headerBadge.classList.remove('hidden');
        headerBadge.classList.add('flex');
        headerBadge.textContent = totalCount;
      } else {
        headerBadge.classList.add('hidden');
        headerBadge.classList.remove('flex');
      }

      // Sticky Bottom Bar
      const stickyBar = document.getElementById('sticky-cart-bar');
      const stickyCount = document.getElementById('sticky-cart-count');
      const stickyTotal = document.getElementById('sticky-cart-total');

      if (totalCount > 0) {
        stickyBar.classList.remove('hidden');
        stickyCount.textContent = totalCount;
        stickyTotal.textContent = formattedTotal;
      } else {
        stickyBar.classList.add('hidden');
      }

      // Modal Details
      const modalList = document.getElementById('cart-items-list');
      const modalTotal = document.getElementById('cart-modal-total');
      modalTotal.textContent = formattedTotal;

      if (items.length === 0) {
        modalList.innerHTML = '<p class="text-center text-sm text-zinc-500 py-6">Seu carrinho está vazio.</p>';
      } else {
        modalList.innerHTML = items.map(item => `
          <div class="flex items-center justify-between p-3 rounded-xl bg-zinc-800/60 border border-zinc-700/50">
            <div>
              <p class="text-sm font-bold text-white">${item.name}</p>
              <p class="text-xs text-amber-400">R$ ${(item.price * item.quantity).toFixed(2).replace('.', ',')}</p>
            </div>
            <div class="flex items-center gap-2">
              <button onclick="updateCartQuantity(${item.id}, -1)" class="w-7 h-7 rounded-lg bg-zinc-700 text-white font-bold flex items-center justify-center hover:bg-zinc-600">-</button>
              <span class="text-sm font-bold w-4 text-center">${item.quantity}</span>
              <button onclick="updateCartQuantity(${item.id}, 1)" class="w-7 h-7 rounded-lg bg-amber-500 text-black font-bold flex items-center justify-center hover:bg-amber-400">+</button>
            </div>
          </div>
        `).join('');
      }
    }

    function toggleCartModal(open) {
      const modal = document.getElementById('cart-modal');
      if (open) {
        modal.classList.remove('hidden');
      } else {
        modal.classList.add('hidden');
      }
    }

    // Disparo para WhatsApp com encodeURIComponent
    function checkoutWhatsApp() {
      const items = Object.values(cart);
      if (items.length === 0) {
        showToast('Adicione ao menos um item ao carrinho.', 'info');
        return;
      }

      const name = document.getElementById('order-name').value.trim();
      const address = document.getElementById('order-address').value.trim();
      const payment = document.getElementById('order-payment').value;
      const notes = document.getElementById('order-notes').value.trim();

      if (!name) {
        showToast('Por favor, informe seu nome.', 'info');
        document.getElementById('order-name').focus();
        return;
      }

      if (!address) {
        showToast('Por favor, informe o endereço de entrega.', 'info');
        document.getElementById('order-address').focus();
        return;
      }

      const totalPrice = items.reduce((acc, item) => acc + (item.price * item.quantity), 0);
      const formattedTotal = `R$ ${totalPrice.toFixed(2).replace('.', ',')}`;

      let msg = `🍔 *NOVO PEDIDO - BURGUER & CIA*\n\n`;
      msg += `👤 *Cliente:* ${name}\n`;
      msg += `📍 *Endereço:* ${address}\n`;
      msg += `💳 *Forma de Pagamento:* ${payment}\n`;
      if (notes) {
        msg += `📝 *Observações:* ${notes}\n`;
      }
      msg += `\n*ITENS DO PEDIDO:*\n`;

      items.forEach(item => {
        const itemSubtotal = (item.price * item.quantity).toFixed(2).replace('.', ',');
        msg += `• ${item.quantity}x ${item.name} - R$ ${itemSubtotal}\n`;
      });

      msg += `\n💰 *VALOR TOTAL: ${formattedTotal}*\n`;
      msg += `\nOlá, gostaria de confirmar este pedido!`;

      const whatsappNumber = '5511954532927';
      const encodedMsg = encodeURIComponent(msg);
      const url = `https://wa.me/${whatsappNumber}?text=${encodedMsg}`;

      window.open(url, '_blank');
      showToast('Redirecionando para o WhatsApp...', 'success');
      toggleCartModal(false);
    }

    // Inicialização
    renderProducts();
  </script>
</body>
</html>
